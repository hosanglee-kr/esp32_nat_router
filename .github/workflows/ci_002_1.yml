name: PR_002_01_dev 

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # 수동 실행 트리거 추가

jobs:
  # Step 1: platformio.ini에서 환경 목록 가져오기
  get_environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.read_output.outputs.envs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git 정보를 가져와 'not a git repository' 에러 방지

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: List PlatformIO environments
        id: list_envs
        run: |
          python -c "
          import configparser
          import json
          config = configparser.ConfigParser()
          config.read('platformio.ini')
          envs = [section.split(':', 1)[1] for section in config.sections() if section.startswith('env:')]
          print(json.dumps(envs))
          " > envs.json
        shell: bash

      - name: Read environments to output
        id: read_output
        run: |
          ENVS=$(<envs.json)
          echo "envs=${ENVS}" >> $GITHUB_OUTPUT
        shell: bash

  # Step 2: 가져온 환경 목록을 사용하여 빌드 실행
  build:
    runs-on: ubuntu-latest
    needs: get_environments
    strategy:
      fail-fast: false
      matrix:
        environments: ${{ fromJson(needs.get_environments.outputs.environments) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 모든 빌드 단계에서 Git 정보 유지

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # [중요] 기존 꼬인 의존성 파일 강제 제거
      # idf_component.yml 설정이 반영되도록 lock 파일을 삭제합니다.
      # 기존 꼬인 의존성 파일과 캐시된 폴더 완벽히 강제 제거
      - name: Clean Dependency Lock
        run: |
          rm -f dependencies.lock
          rm -rf managed_components
          rm -rf .pio


      - name: Run PlatformIO build for ${{ matrix.environments }}
        env:
          # 수동 실행 시 github.event.number가 없으므로 기본값 0 설정
          VERSION: "0.0.${{ github.event.number || '0' }}"
        run: pio run -e ${{ matrix.environments }}

      - name: Build filesystem image for ${{ matrix.environments }}
        run: pio run -e ${{ matrix.environments }} --target buildfs
        continue-on-error: true

      # 빌드 결과물 업로드
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environments }}-firmware
          path: .pio/build/${{ matrix.environments }}/firmware*.bin

      - name: Upload littlefs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environments }}-littlefs
          path: .pio/build/${{ matrix.environments }}/littlefs.bin

      - name: Upload partitions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environments }}-partitions
          path: .pio/build/${{ matrix.environments }}/partitions.bin

      - name: Upload bootloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environments }}-bootloader
          path: .pio/build/${{ matrix.environments }}/bootloader.bin
