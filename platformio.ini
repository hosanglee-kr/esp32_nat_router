[platformio]
src_dir = main
; 기본적으로 빌드할 환경을 지정합니다.
default_envs = esp32-s3-n16r8

[env]
platform = espressif32@6.4.0
framework = espidf
platform_packages =
    framework-espidf @ https://github.com/tasmota/esp-idf/releases/download/v5.1.2-org/esp-idf-v5.1.2-org.zip
monitor_filters = direct
monitor_speed = 115200

[env:esp32-s3-n16r8]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_example.csv

; S3 N16R8 하드웨어 사양 (16MB Flash / OPI PSRAM)
board_build.arduino.memory_type = opi_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
