; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env]
platform = espressif32@^6.4.0
framework = espidf
platform_packages =
        framework-espidf @ https://github.com/tasmota/esp-idf/releases/download/v5.1.2-org/esp-idf-v5.1.2-org.zip
;board_build.partitions = partitions_example.csv
monitor_filters = direct
monitor_speed = 115200


[env:esp32-s3-n16r8]
	board = esp32-s3-devkitm-1 ; 기본 S3 보드 정의 사용
	board_build.partitions = default_16MB.csv

	; 보드 상세 사양 강제 지정 (16MB Flash / OPI PSRAM)
	board_build.arduino.memory_type = opi_opi
	board_build.f_flash = 80000000L
	board_build.f_cpu = 240000000L
	board_upload.flash_size = 16MB

	build_flags =
	    -D BOARD_HAS_PSRAM
	    ; 16MB 플래시에 적합한 파티션 테이블 사용 권장 (default_16MB.csv 등)
	    -D ARDUINO_USB_MODE=1
	    -D ARDUINO_USB_CDC_ON_BOOT=1
            

[env_esp32dev]
board = esp32dev

[env_esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env_esp32-s3]
board = esp32s3box

; [env:esp32-s3-debug]
; extends = env:esp32-s3
; upload_protocol = esp-builtin
; debug_tool = esp-builtin
; build_type = debug

[env_wt32-eth01]
board = esp32dev
board_build.extra_flags =
    -DCONFIG_ETH_UPLINK=1
    -DCONFIG_ETH_MDC_GPIO=23
    -DCONFIG_ETH_MDIO_GPIO=18
    -DCONFIG_ETH_PHY_ADDR=1
    -DCONFIG_ETH_PHY_POWER_GPIO=16
